<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi capacitación — Universidad Purifika</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><img src="assets/logo-purifika-white.png" alt="" onerror="this.style.display='none'"> Universidad Purifika</div>
  <div class="user-chip"><span id="nombreUsuario"></span><button class="link" onclick="logout()">Salir</button></div>
</div>
<div class="shell">
  <div class="sidebar">
    <a href="dashboard.html" class="active">Mi capacitación</a>
    <a href="resumen.html">Mi resumen</a>
    <a href="certificados.html">Certificados</a>
    <a href="admin.html" id="linkAdmin" style="display:none;">Panel de administración</a>
  </div>
  <div class="content">
    <h1>Mi capacitación</h1>
    <p class="subtitle">Tu progreso por categoría. Da clic en una categoría para ver sus videos.</p>

    <div class="panel" id="panelResumen" style="display:none;">
      <div class="resumen-general">
        <div class="progreso-circular" id="anilloGeneral" data-size="86"></div>
        <div class="texto">
          <div class="sub" style="font-size:12px;color:var(--charcoal);">Progreso general</div>
          <div id="resumenTexto" style="font-size:14px;font-weight:500;"></div>
        </div>
      </div>
    </div>

    <div class="buscador-wrap">
      <input type="text" id="buscador" placeholder="Buscar un video o tema…">
    </div>

    <div class="categorias-nav" id="categoriasNav"></div>

    <div id="cursos">Cargando…</div>
  </div>
</div>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
